name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # 片方の OS が落ちても、もう片方の結果は見たい
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # shell/shim_test.go は pwt.sh を bash と zsh の両方で読み込む。
      # zsh が無いと t.Skipf で黙って飛ばされるので Ubuntu には入れておく。
      # macOS ランナーには標準で入っている。
      - name: Install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh

      # gofmt -l は差分があっても終了コード 0 なので、自前で落とす
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...
