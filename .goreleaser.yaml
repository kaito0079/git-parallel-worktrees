version: 2

project_name: pwt

before:
  hooks:
    - go mod tidy

builds:
  - id: pwt
    main: ./cmd/pwt
    binary: pwt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - shell/pwt.sh

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew formula は tools/formula が生成する。
# goreleaser の brews は非推奨、後継の homebrew_casks は cask のため
# shell/pwt.sh を安定したパスに置けない。
#
#   goreleaser release --clean
#   go run ./tools/formula
